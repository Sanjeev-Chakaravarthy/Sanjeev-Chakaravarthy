<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 205" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="pcard-bg-wibuilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160D15" />
      <stop offset="60%" stop-color="#100910" />
      <stop offset="100%" stop-color="#0A070C" />
    </linearGradient>
    <linearGradient id="pcard-border-wibuilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#701A3D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2D111E" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="pcard-glow-wibuilt" cx="10%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="438" height="203" rx="12" fill="url(#pcard-bg-wibuilt)" stroke="url(#pcard-border-wibuilt)" stroke-width="1.2" />
  <rect x="1" y="1" width="438" height="203" rx="12" fill="url(#pcard-glow-wibuilt)" />

  <!-- Accent Top Line -->
  <line x1="24" y1="1" x2="100" y2="1" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />

  <!-- Header Category & Status -->
  <g transform="translate(24, 22)">
    <text x="0" y="13" fill="#F59E0B" font-size="9" font-weight="700" font-family="SF Mono, Menlo, monospace" letter-spacing="1">CREATIVE STUDIO // 3D WEBGL</text>
  </g>
  
        <g transform="translate(350, 20)">
          <rect x="0" y="0" width="66" height="20" rx="10" fill="#12251B" stroke="#10B981" stroke-width="0.8" />
          <circle cx="10" cy="10" r="3" fill="#10B981" />
          <text x="22" y="13.5" fill="#A7F3D0" font-size="9" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">LIVE APP</text>
        </g>
        

  <!-- Project Title with Icon -->
  <g transform="translate(24, 68)">
    <g transform="translate(0, -18) scale(0.9)" stroke="#F59E0B" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
    </g>
    <text x="32" y="0" fill="#FAF7F9" font-size="19" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" letter-spacing="0.3">WIBUILT</text>
  </g>

  <!-- Short Description -->
  <g transform="translate(24, 98)">
    <text x="0" y="12" fill="#D1A3B8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" letter-spacing="0.1">
      <tspan x="0" dy="0">Digital product studio featuring real-time Three.js 3D viewers,</tspan>
      <tspan x="0" dy="17">dynamic GPU tier profiling, and 60fps mobile-adapted shaders.</tspan>
    </text>
  </g>

  <!-- Tech Badges -->
  
        <g transform="translate(24, 162)">
          <rect x="0" y="0" width="65.0" height="22" rx="5" fill="#1C1019" stroke="#3D1828" stroke-width="0.8" />
          <text x="32.5" y="14.5" fill="#C77B9B" font-size="10" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle">Next.js</text>
        </g>
        

        <g transform="translate(97.0, 162)">
