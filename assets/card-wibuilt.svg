          <text x="36.0" y="14.5" fill="#C77B9B" font-size="10" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle">Three.js</text>
        </g>
        

        <g transform="translate(177.0, 162)">
