<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 205" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="pcard-bg-healthscan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160D15" />
      <stop offset="60%" stop-color="#100910" />
      <stop offset="100%" stop-color="#0A070C" />
    </linearGradient>
    <linearGradient id="pcard-border-healthscan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#701A3D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2D111E" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="pcard-glow-healthscan" cx="10%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="438" height="203" rx="12" fill="url(#pcard-bg-healthscan)" stroke="url(#pcard-border-healthscan)" stroke-width="1.2" />
  <rect x="1" y="1" width="438" height="203" rx="12" fill="url(#pcard-glow-healthscan)" />

  <!-- Accent Top Line -->
  <line x1="24" y1="1" x2="100" y2="1" stroke="#10B981" stroke-width="2" stroke-linecap="round" />

  <!-- Header Category & Status -->
  <g transform="translate(24, 22)">
    <text x="0" y="13" fill="#10B981" font-size="9" font-weight="700" font-family="SF Mono, Menlo, monospace" letter-spacing="1">AI DIAGNOSTICS // CLINICAL TRIAGE</text>
  </g>
  
        <g transform="translate(340, 20)">
          <rect x="0" y="0" width="76" height="20" rx="10" fill="#1E1428" stroke="#8B5CF6" stroke-width="0.8" />
          <circle cx="10" cy="10" r="3" fill="#A78BFA" />
          <text x="22" y="13.5" fill="#DDD6FE" font-size="9" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">ACTIVE REPO</text>
        </g>
        

  <!-- Project Title with Icon -->
  <g transform="translate(24, 68)">
    <g transform="translate(0, -18) scale(0.9)" stroke="#10B981" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
    </g>
    <text x="32" y="0" fill="#FAF7F9" font-size="19" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" letter-spacing="0.3">HealthScan AI</text>
  </g>

  <!-- Short Description -->
  <g transform="translate(24, 98)">
    <text x="0" y="12" fill="#D1A3B8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" letter-spacing="0.1">
      <tspan x="0" dy="0">Intelligent health diagnostic assistant evaluating symptom clusters</tspan>
      <tspan x="0" dy="17">and biomedical data for structured clinical triage support.</tspan>
    </text>
  </g>

  <!-- Tech Badges -->
  
        <g transform="translate(24, 162)">
          <rect x="0" y="0" width="58.0" height="22" rx="5" fill="#1C1019" stroke="#3D1828" stroke-width="0.8" />
          <text x="29.0" y="14.5" fill="#C77B9B" font-size="10" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle">Python</text>
        </g>
        

        <g transform="translate(90.0, 162)">
          <rect x="0" y="0" width="128.0" height="22" rx="5" fill="#1C1019" stroke="#3D1828" stroke-width="0.8" />
          <text x="64.0" y="14.5" fill="#C77B9B" font-size="10" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle">Machine Learning</text>
        </g>
        

        <g transform="translate(226.0, 162)">
          <rect x="0" y="0" width="65.0" height="22" rx="5" fill="#1C1019" stroke="#3D1828" stroke-width="0.8" />
          <text x="32.5" y="14.5" fill="#C77B9B" font-size="10" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle">FastAPI</text>
        </g>
        

        <g transform="translate(299.0, 162)">
          <rect x="0" y="0" width="51.0" height="22" rx="5" fill="#1C1019" stroke="#3D1828" stroke-width="0.8" />
          <text x="25.5" y="14.5" fill="#C77B9B" font-size="10" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle">React</text>
        </g>
        
</svg>