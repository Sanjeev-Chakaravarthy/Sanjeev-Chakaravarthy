    <text x="32" y="0" fill="#FAF7F9" font-size="19" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" letter-spacing="0.3">PG Finder</text>
  </g>

  <!-- Short Description -->
  <g transform="translate(24, 98)">
    <text x="0" y="12" fill="#D1A3B8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" letter-spacing="0.1">
      <tspan x="0" dy="0">Full-stack student accommodation discovery platform with</tspan>
      <tspan x="0" dy="17">location search, 10+ REST APIs, and budget filtering.</tspan>
    </text>
  </g>

  <!-- Tech Badges -->
  
        <g transform="translate(24, 162)">
