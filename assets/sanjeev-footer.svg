<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" width="100%" height="auto" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sf-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A12" />
      <stop offset="50%" stop-color="#0E080F" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Top Border Glow Gradient -->
    <linearGradient id="sf-border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity="1" />
      <stop offset="70%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.1" />
    </linearGradient>

    <!-- Radial Aura -->
    <radialGradient id="sf-center-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>

    <!-- Pipeline Signal Beam -->
    <linearGradient id="sf-signal-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" />
      <stop offset="50%" stop-color="#FAF7F9" />
      <stop offset="100%" stop-color="#701A3D" />
    </linearGradient>

    <style>
      @keyframes sfBeam {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: -240; }
      }
      @keyframes sfNodePulse {
        0%, 100% { r: 3.5; opacity: 0.7; }
        50% { r: 5; opacity: 1; }
      }
      @keyframes sfGlowPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      .sf-pipe-beam {
        stroke-dasharray: 40 80;
        animation: sfBeam 3s linear infinite;
      }
      .sf-pulse-node {
        animation: sfNodePulse 2.5s ease-in-out infinite;
      }
      .sf-glow-line {
        animation: sfGlowPulse 4s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .sf-pipe-beam, .sf-pulse-node, .sf-glow-line {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Base Card -->
  <rect x="2" y="2" width="916" height="156" rx="14" fill="url(#sf-bg-grad)" stroke="#381020" stroke-width="1.2" />
  <rect x="2" y="2" width="916" height="156" rx="14" fill="url(#sf-center-glow)" />

  <!-- Top Accent Laser Line -->
  <line x1="20" y1="2" x2="900" y2="2" stroke="url(#sf-border-grad)" stroke-width="2" class="sf-glow-line" />

  <!-- Geometric Pipeline / Git Commit Visual -->
  <g transform="translate(360, 36)">
    <!-- Pipeline Track -->
    <line x1="0" y1="0" x2="200" y2="0" stroke="#3D1325" stroke-width="1.8" />
    <line x1="0" y1="0" x2="200" y2="0" stroke="url(#sf-signal-beam)" stroke-width="2" class="sf-pipe-beam" />

    <!-- Node 1: Commit -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="8" fill="#140A12" stroke="#701A3D" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3.5" fill="#C77B9B" class="sf-pulse-node" />
      <text x="0" y="-14" fill="#8E6F82" font-size="9" font-family="SF Mono, monospace" text-anchor="middle">COMMIT</text>
    </g>

    <!-- Node 2: Build -->
    <g transform="translate(100, 0)">
      <circle cx="0" cy="0" r="8" fill="#140A12" stroke="#701A3D" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3.5" fill="#E5B5C7" class="sf-pulse-node" />
      <text x="0" y="-14" fill="#8E6F82" font-size="9" font-family="SF Mono, monospace" text-anchor="middle">BUILD</text>
    </g>

    <!-- Node 3: Ship -->
    <g transform="translate(200, 0)">
      <circle cx="0" cy="0" r="8" fill="#140A12" stroke="#701A3D" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3.5" fill="#4ADE80" />
      <text x="0" y="-14" fill="#8E6F82" font-size="9" font-family="SF Mono, monospace" text-anchor="middle">SHIP</text>
    </g>
  </g>

  <!-- Central Statement -->
  <g transform="translate(460, 92)">
    <text x="0" y="0" fill="#FAF7F9" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle" letter-spacing="0.5">
      “Building ideas into reality, one commit at a time.”
    </text>
  </g>

  <!-- Subtitle & Identity Footnote -->
  <g transform="translate(460, 126)">
    <text x="0" y="0" fill="#C77B9B" font-size="11" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle" letter-spacing="0.6">
      SANJEEV CHAKARAVARTHY
      <tspan fill="#701A3D">  //  </tspan>
      B.TECH CSE • LOVELY PROFESSIONAL UNIVERSITY × KALVIUM
      <tspan fill="#701A3D">  //  </tspan>
      2024–2028
    </text>
  </g>
</svg>