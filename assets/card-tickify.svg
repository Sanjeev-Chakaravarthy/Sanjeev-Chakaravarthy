<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 205" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="pcard-bg-tickify" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160D15" />
      <stop offset="60%" stop-color="#100910" />
      <stop offset="100%" stop-color="#0A070C" />
    </linearGradient>
    <linearGradient id="pcard-border-tickify" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#701A3D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2D111E" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="pcard-glow-tickify" cx="10%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="438" height="203" rx="12" fill="url(#pcard-bg-tickify)" stroke="url(#pcard-border-tickify)" stroke-width="1.2" />
  <rect x="1" y="1" width="438" height="203" rx="12" fill="url(#pcard-glow-tickify)" />

  <!-- Accent Top Line -->
  <line x1="24" y1="1" x2="100" y2="1" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />

  <!-- Header Category & Status -->
  <g transform="translate(24, 22)">
    <text x="0" y="13" fill="#06B6D4" font-size="9" font-weight="700" font-family="SF Mono, Menlo, monospace" letter-spacing="1">PRODUCTIVITY // ANALYTICS DASHBOARD</text>
  </g>
  
        <g transform="translate(350, 20)">
          <rect x="0" y="0" width="66" height="20" rx="10" fill="#12251B" stroke="#10B981" stroke-width="0.8" />
          <circle cx="10" cy="10" r="3" fill="#10B981" />
          <text x="22" y="13.5" fill="#A7F3D0" font-size="9" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">LIVE APP</text>
        </g>
        

  <!-- Project Title with Icon -->
  <g transform="translate(24, 68)">
    <g transform="translate(0, -18) scale(0.9)" stroke="#06B6D4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
    </g>
    <text x="32" y="0" fill="#FAF7F9" font-size="19" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" letter-spacing="0.3">Tickify</text>
  </g>

  <!-- Short Description -->
  <g transform="translate(24, 98)">
    <text x="0" y="12" fill="#D1A3B8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" letter-spacing="0.1">
      <tspan x="0" dy="0">Velocity-tracking productivity application with task priority</tspan>
      <tspan x="0" dy="17">weights, completion metrics, and structured accountability logs.</tspan>
    </text>
  </g>

  <!-- Tech Badges -->
  
        <g transform="translate(24, 162)">
          <rect x="0" y="0" width="51.0" height="22" rx="5" fill="#1C1019" stroke="#3D1828" stroke-width="0.8" />
          <text x="25.5" y="14.5" fill="#C77B9B" font-size="10" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle">React</text>
        </g>
        

        <g transform="translate(83.0, 162)">
          <rect x="0" y="0" width="86.0" height="22" rx="5" fill="#1C1019" stroke="#3D1828" stroke-width="0.8" />
          <text x="43.0" y="14.5" fill="#C77B9B" font-size="10" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle">Express.js</text>
        </g>
        

        <g transform="translate(177.0, 162)">
          <rect x="0" y="0" width="65.0" height="22" rx="5" fill="#1C1019" stroke="#3D1828" stroke-width="0.8" />
          <text x="32.5" y="14.5" fill="#C77B9B" font-size="10" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle">MongoDB</text>
        </g>
        

        <g transform="translate(250.0, 162)">
          <rect x="0" y="0" width="79.0" height="22" rx="5" fill="#1C1019" stroke="#3D1828" stroke-width="0.8" />
          <text x="39.5" y="14.5" fill="#C77B9B" font-size="10" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle">Chakra UI</text>
        </g>
        
</svg>