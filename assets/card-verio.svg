<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 205" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="pcard-bg-verio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160D15" />
      <stop offset="60%" stop-color="#100910" />
      <stop offset="100%" stop-color="#0A070C" />
    </linearGradient>
    <linearGradient id="pcard-border-verio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#701A3D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2D111E" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="pcard-glow-verio" cx="10%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="438" height="203" rx="12" fill="url(#pcard-bg-verio)" stroke="url(#pcard-border-verio)" stroke-width="1.2" />
  <rect x="1" y="1" width="438" height="203" rx="12" fill="url(#pcard-glow-verio)" />

  <!-- Accent Top Line -->
  <line x1="24" y1="1" x2="100" y2="1" stroke="#A855F7" stroke-width="2" stroke-linecap="round" />

  <!-- Header Category & Status -->
  <g transform="translate(24, 22)">
    <text x="0" y="13" fill="#A855F7" font-size="9" font-weight="700" font-family="SF Mono, Menlo, monospace" letter-spacing="1">HIGH-ASSURANCE // FINTECH ENGINE</text>
  </g>
  
        <g transform="translate(350, 20)">
          <rect x="0" y="0" width="66" height="20" rx="10" fill="#12251B" stroke="#10B981" stroke-width="0.8" />
